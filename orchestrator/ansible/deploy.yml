---
- name: Pull latest Frappe app, migrate, and restart Bench
  hosts: erp_servers
  gather_facts: no
  become: yes
  become_user: frappe

  vars:
    bench_path: "/home/frappe/frappe-bench"
    app_name: "orchestrator"
    repo_url: "https://github.com/munyaradzichirove/frappe_ci-cd_manager.git"
    branch: "main"
    remote: "upstream"

  tasks:
    - name: Ensure Bench apps directory exists
      file:
        path: "{{ bench_path }}/apps"
        state: directory

    - name: Pull latest code for the app (once per server)
      git:
        repo: "{{ repo_url }}"
        dest: "{{ bench_path }}/apps/{{ app_name }}"
        version: "{{ branch }}"
        remote: "{{ remote }}"
        force: yes
      run_once: true
      delegate_to: "{{ inventory_hostname }}"

    - name: Run Frappe migrations for each site
      command: bench --site {{ hostvars[inventory_hostname]['site_name'] }} migrate
      args:
        chdir: "{{ bench_path }}"
